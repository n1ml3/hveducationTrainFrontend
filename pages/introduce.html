<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/information.css">
    <link rel="stylesheet" href="../styles/contact.css">
    <link rel="stylesheet" href="../styles/footer.css">
    <link rel="stylesheet" href="../styles/navbar.css">

    <!-- jQuery CDN (dùng để load component) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Giới thiệu</title>
</head>

<body>
    <!-- Navbar Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS Bundle (bao gồm Popper — cần cho navbar toggler) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Navbar active state & animation script -->
    <script src="../scripts/navbar.js"></script>

    <!-- Course slider — cuộn ngang + kéo chuột -->
    <script src="../scripts/course-slider.js"></script>

    <!-- jQuery load components -->
    <script>
        $(function () {
            // Sau khi navbar load xong, gọi initNavbar() để set active state
            $("#navbar-placeholder").load("../compoments/navbar.html nav", function () {
                if(typeof initNavbar === 'function') {
                    initNavbar();
                }
            });
            $("#footer-placeholder").load("../compoments/footer.html");
        });
    </script>
</body>

</html>
