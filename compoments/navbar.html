<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HVedu Navbar</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/navbar.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">
            <img src="../assets/logo.svg" alt="HVedu Logo" class="logo-icon">
            <div class="logo-text">
                <span class="logo-title">HVEducation</span>
                <span class="logo-subtitle">Online learning solution</span>
            </div>
        </div>

        <ul class="nav-menu">
            <li class="nav-item active">Trang chủ</li>
            <li class="nav-item">Giới thiệu</li>
            <li class="nav-item">
                Khoá học
                <img src="../assets/arrow.svg" alt="" class="arrow-icon">
            </li>
            <li class="nav-item">Tài liệu học</li>
            <li class="nav-item">Blog</li>
            <li class="nav-item">Liên hệ</li>
        </ul>

        <div class="nav-actions">
            <div class="icons-group">
                <div class="icon-wrapper">
                    <img src="../assets/icons.svg" alt="Search and Cart">
                    <span class="cart-badge">2</span>
                </div>
            </div>
            <button class="btn-login">Đăng nhập</button>
        </div>
    </nav>
</body>
</html>
